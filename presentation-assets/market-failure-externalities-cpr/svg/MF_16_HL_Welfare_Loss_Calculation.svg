xt-anchor="middle" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="9" stroke-linejoin="round">base = 50 − 40 = 10</text><line x1="606.0" y1="360.8" x2="606.0" y2="456.2" stroke="#5B4B8A" stroke-width="4" stroke-linecap="round" marker-end="url(#m5B4B8A16)" marker-start="url(#m5B4B8A16)" opacity="1"/><text x="624.0" y="390.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="31" fill="#5B4B8A" text-anchor="start" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="9" stroke-linejoin="round">height = 90 − 70</text><text x="624.0" y="428.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="31" fill="#5B4B8A" text-anchor="start" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="9" stroke-linejoin="round">= $20</text><circle cx="560.0" cy="456.2" r="12" fill="#01132C" stroke="#FFFDFA" stroke-width="4"/><circle cx="496.0" cy="408.5" r="14" fill="#FFFDFA" stroke="#86662B" stroke-width="5"/><circle cx="496.0" cy="408.5" r="5.3" fill="#86662B"/><rect x="870.4" y="19.2" width="309.6" height="41.6" rx="20.8" fill="#5A6372" fill-opacity="1"/><text x="1025.2" y="41.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="700" dominant-baseline="middle">Illustrative values</text><text x="80.0" y="940.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#C0533E" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">Welfare loss = ½ × base × height = ½ × 10 × $20 = $100</text></svg>