<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1080" viewBox="0 0 2400 1080"><defs><marker id="mA3402B46" viewBox="0 0 46 46" refX="39.1" refY="23.0" markerWidth="46" markerHeight="46" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L46,23.0 L0,46 L10.1,23.0 z" fill="#A3402B"/></marker><marker id="m2F6B4F46" viewBox="0 0 46 46" refX="39.1" refY="23.0" markerWidth="46" markerHeight="46" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L46,23.0 L0,46 L10.1,23.0 z" fill="#2F6B4F"/></marker><marker id="m01132C22" viewBox="0 0 22 22" refX="18.7" refY="11.0" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L22,11.0 L0,22 L4.8,11.0 z" fill="#01132C"/></marker></defs><rect x="500.0" y="250.0" width="300.0" height="300.0" rx="18" fill="#FFFFFF" fill-opacity="1" stroke="#01132C" stroke-width="5"/><rect x="506.0" y="364.0" width="288.0" height="180.0" rx="12" fill="#2F6B4F" fill-opacity="0.28"/><text x="650.0" y="457.0" font-family="'IBM Plex Mono', monospace" font-size="38" fill="#01132C" text-anchor="middle" font-weight="800" dominant-baseline="middle" letter-spacing="3" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">STOCK</text><text x="650.0" y="150.0" font-family="Fraunces, Georgia, serif" font-size="48" fill="#01132C" text-anchor="middle" font-weight="600" dominant-baseline="middle">Renewable resource</text><text x="650.0" y="205.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#5A6372" text-anchor="middle" font-weight="600" dominant-baseline="middle">fish, groundwater, forests</text><line x1="800.0" y1="490.0" x2="990.0" y2="490.0" stroke="#A3402B" stroke-width="18" stroke-linecap="butt" marker-end="url(#mA3402B46)" opacity="1"/><text x="900.0" y="550.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#A3402B" text-anchor="middle" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Extraction</text><line x1="310.0" y1="320.0" x2="500.0" y2="320.0" stroke="#2F6B4F" stroke-width="18" stroke-linecap="butt" marker-end="url(#m2F6B4F46)" opacity="1"/><text x="225.0" y="265.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#2F6B4F" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Regeneration</text><text x="225.0" y="380.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#2F6B4F" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="9" stroke-linejoin="round">natural growth</text><text x="60.0" y="680.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#2F6B4F" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Extraction ≤ regeneration</text><text x="60.0" y="728.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">→ the stock is maintained or grows</text><text x="60.0" y="806.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#A3402B" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Extraction &gt; regeneration</text><text x="60.0" y="854.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">→ the stock falls; past a threshold,</text><text x="60.0" y="898.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">regeneration itself can collapse</text><rect x="1160.0" y="250.0" width="260.0" height="300.0" rx="18" fill="#FFFFFF" fill-opacity="1" stroke="#01132C" stroke-width="5"/><rect x="1166.0" y="415.0" width="248.0" height="129.0" rx="12" fill="#5A6372" fill-opacity="0.28"/><text x="1290.0" y="482.5" font-family="'IBM Plex Mono', monospace" font-size="38" fill="#01132C" text-anchor="middle" font-weight="800" dominant-baseline="middle" letter-spacing="3" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">STOCK</text><text x="1290.0" y="150.0" font-family="Fraunces, Georgia, serif" font-size="48" fill="#01132C" text-anchor="middle" font-weight="600" dominant-baseline="middle">Non-renewable resource</text><text x="1290.0" y="205.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#5A6372" text-anchor="middle" font-weight="600" dominant-baseline="middle">coal, oil, minerals</text><line x1="1420.0" y1="490.0" x2="1610.0" y2="490.0" stroke="#A3402B" stroke-width="18" stroke-linecap="butt" marker-end="url(#mA3402B46)" opacity="1"/><text x="1520.0" y="550.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#A3402B" text-anchor="middle" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Extraction</text><text x="1050.0" y="310.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#5A6372" text-anchor="middle" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">no inflow</text><text x="1050.0" y="354.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#5A6372" text-anchor="middle" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="8" stroke-linejoin="round">(or negligible)</text><text x="960.0" y="680.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#A3402B" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">Any extraction depletes</text><text x="960.0" y="726.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#A3402B" text-anchor="start" font-weight="800" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="11" stroke-linejoin="round">a finite stock</text><text x="960.0" y="806.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="700" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">Sustainability questions:</text><text x="960.0" y="854.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">the rate of use, substitutes,</text><text x="960.0" y="898.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#01132C" text-anchor="start" font-weight="600" dominant-baseline="middle" paint-order="stroke" stroke="#FFFDFA" stroke-width="10" stroke-linejoin="round">external costs of use</text><path d="M1800.0,760.0 L1810.0,748.0 L1820.0,736.4 L1830.0,725.4 L1840.0,714.9 L1850.0,704.8 L1860.0,695.2 L1870.0,686.2 L1880.0,677.6 L1890.0,669.5 L1900.0,661.9 L1910.0,654.8 L1920.0,648.1 L1930.0,642.0 L1940.0,636.4 L1950.0,631.2 L1960.0,626.5 L1970.0,622.4 L1980.0,618.7 L1990.0,615.5 L2000.0,612.8 L2010.0,610.6 L2020.0,608.9 L2030.0,607.6 L2040.0,606.9 L2050.0,606.7 L2060.0,606.9