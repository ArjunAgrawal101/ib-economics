<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700&family=Newsreader:ital,opsz@1,6..72&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#f5f0e6;font-family:Manrope,sans-serif;color:#0c1a30;overflow:hidden;position:relative}
  .wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 430px}
  .copy{padding:70px 0 60px 76px;display:flex;flex-direction:column}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#7d6229}
  .eyebrow i{display:block;width:44px;height:1px;background:#b39350}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:116px;line-height:.9;letter-spacing:-.02em;margin-top:30px}
  .tag{font-family:Newsreader,serif;font-style:italic;font-size:38px;margin-top:26px}
  .tag b{color:#b39350;font-weight:400}
  .desc{margin-top:auto;display:flex;gap:22px;font-size:17px;font-weight:600}
  .desc span{display:flex;align-items:center;gap:9px}
  .desc span::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--c)}
  .art{position:relative}
  .arch{position:absolute;left:58px;right:52px;top:64px;bottom:-2px;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid rgba(12,26,48,.1);background:#ece5d6}
  .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
  .key{position:absolute;left:46px;right:40px;top:52px;bottom:-2px;border-radius:999px 999px 0 0;border:1px solid rgba(179,147,80,.55)}
  svg.orb{position:absolute;inset:0}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;display:grid;grid-template-columns:1fr 1fr 1fr}
</style></head>
<body>
<div class="wrap">
  <div class="copy">
    <div class="eyebrow"><i></i>The Academic Ecosystem</div>
    <h1>Arjun<br>Agrawal</h1>
    <div class="tag">Ideas<b>.</b> Knowledge<b>.</b> Perspectives<b>.</b></div>
    <div class="desc">
      <span style="--c:#1f6f61">Economics</span>
      <span style="--c:#93541f">Business Management</span>
      <span style="--c:#3a4795">Political Studies &amp; Global Affairs</span>
    </div>
  </div>
  <div class="art">
    <svg class="orb" viewBox="0 0 430 630" fill="none"><ellipse cx="215" cy="330" rx="205" ry="250" stroke="#b39350" stroke-opacity=".5"/><ellipse cx="215" cy="330" rx="180" ry="280" stroke="#0c1a30" stroke-opacity=".12" transform="rotate(-20 215 330)"/></svg>
    <div class="key"></div>
    <div class="arch"><img src="PORTRAIT" alt=""></div>
  </div>
</div>
<div class="bar"><div style="background:#1f6f61"></div><div style="background:#93541f"></div><div style="background:#3a4795"></div></div>
</body></html>
